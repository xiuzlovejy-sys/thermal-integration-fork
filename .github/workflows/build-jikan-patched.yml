name: build-jikan-patched

# 构建「外部 ETA 优先」的 Jikan 1.0.2（Jy's charge 定制版）。
# 构建方式与 Jikan 官方 CI 保持一致：waruhachi/theos-action + 官方 SDK 包
# （Jikan 的 Makefile 写死 TARGET=iphone:clang:16.5:14.0，runner 自带 Xcode 没有 16.5 SDK）。
on:
  workflow_dispatch:
  push:
    paths:
      - "jikan-patch/**"
      - ".github/workflows/build-jikan-patched.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootful, rootless, roothide]
        include:
          - scheme: rootful
            scheme_arg: ""
          - scheme: rootless
            scheme_arg: "THEOS_PACKAGE_SCHEME=rootless"
          - scheme: roothide
            scheme_arg: "THEOS_PACKAGE_SCHEME=roothide"
    steps:
      - uses: actions/checkout@v4

      - name: Clone Jikan 1.0.2
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.0.2 https://github.com/waruhachi/Jikan "$RUNNER_TEMP/jikan"

      - name: Apply external-ETA patch
        run: bash jikan-patch/apply.sh "$RUNNER_TEMP/jikan"

      - name: Set up Theos + SDKs
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: "waruhachi/theos"
          theos-branch: "main"
          sdks-src: "waruhachi/sdks"
          sdks-branch: "main"

      - name: Build package (${{ matrix.scheme }})
        shell: bash
        working-directory: ${{ runner.temp }}/jikan
        run: make clean package FINALPACKAGE=1 ${{ matrix.scheme_arg }}

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: jikan-jys-${{ matrix.scheme }}-deb
          path: ${{ runner.temp }}/jikan/packages/*.deb
          if-no-files-found: error
