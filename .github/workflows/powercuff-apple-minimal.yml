name: Powercuff Apple minimal validation

on:
  workflow_dispatch:
  push:
    branches:
      - powercuff-apple-minimal-validation
    paths:
      - .github/workflows/powercuff-apple-minimal.yml
      - tests/build_powercuff_apple_minimal.sh
      - tests/powercuff_abi_fixture.mm
      - tests/powercuff_arm64e_load_check.mm
      - scripts/check_arm64e_objc_metadata.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and inspect minimal arm64e sample
        run: |
          set -euo pipefail
          CLPC_APPLE_OUTPUT=probe/apple-minimal sh tests/build_powercuff_apple_minimal.sh
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powercuff-apple-minimal
          path: probe/apple-minimal/
          if-no-files-found: warn
